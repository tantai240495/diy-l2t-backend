schema_version: diy-l2t.agents.v2
kind: capability_registry
metadata:
  status: example
  hermes_config_schema: false
  description: Project-owned route/profile/workflow contract mapped to Hermes Kanban.

defaults:
  named_profile_dispatch_mode: kanban
  unknown_route: needs_input
  workspace_kind: worktree
  delivery: local_committed_branch
  one_code_writer_per_workspace: true
  require_independent_review_for_coding: true
  max_changes_requested_cycles: 2

agents:
  orchestrator:
    profile: diy-l2t
    role: orchestrator
    runtime:
      provider: openai-codex
      model: gpt-5.5
    dispatch:
      mode: gateway
    capabilities:
      - route
      - direct-tool
      - delegate-short-task
      - kanban-orchestrate
      - summarize

  coder:
    profile: diy-l2t-coder
    role: coder
    runtime:
      provider: copilot
      model: claude-sonnet-5
      backend: https://api.githubcopilot.com
    dispatch:
      mode: kanban
      assignee: diy-l2t-coder
    capabilities:
      - coding.implement
      - coding.refactor
      - coding.write-unit-integration-tests
    workspace:
      required: true
      default_kind: worktree
      writer: true

  qa:
    profile: diy-l2t-qa
    role: qa
    runtime:
      provider: openai-codex
      model: gpt-5.6-sol
    dispatch:
      mode: kanban
      assignee: diy-l2t-qa
    capabilities:
      - qa.playwright-author
      - qa.playwright-run
      - qa.collect-artifacts
    workspace:
      required: true
      default_kind: worktree
      writer: true
      allowed_environments:
        - local
        - test

  reviewer:
    profile: diy-l2t-reviewer
    role: reviewer
    runtime:
      provider: openai-codex
      model: gpt-5.6-sol
    dispatch:
      mode: kanban
      assignee: diy-l2t-reviewer
    capabilities:
      - coding.review
      - coding.verify-tests
      - qa.review-evidence
    workspace:
      required: true
      default_kind: worktree
      writer: false

routes:
  external.read:
    route_kind: direct_tool
    dispatch_mode: direct
    target: orchestrator
    approval_class: task_policy

  research.synthesize:
    route_kind: delegate
    dispatch_mode: delegate
    target: delegation.default
    approval_class: task_policy

  coding.implement:
    route_kind: named_profile
    dispatch_mode: kanban
    target: coder
    approval_class: task_policy

  qa.e2e:
    route_kind: named_profile
    dispatch_mode: kanban
    target: qa
    approval_class: task_policy

  coding.review:
    route_kind: named_profile
    dispatch_mode: kanban
    target: reviewer
    approval_class: task_policy

  external.write:
    route_kind: direct_tool
    dispatch_mode: direct
    target: orchestrator
    approval_class: explicit_user

  intent.unknown:
    route_kind: needs_input
    dispatch_mode: user
    target: user
    approval_class: not_applicable

workflows:
  coding:
    project_required: true
    board_required: true
    exact_workspace_handoff: true
    sequential_writers: true
    stages:
      - id: implementation
        capability: coding.implement
        required: true
      - id: browser_qa
        capability: qa.e2e
        required_when: task.requires_browser_e2e
      - id: independent_review
        capability: coding.review
        required: true
        tracked_files_read_only: true
    completion_gate:
      field: workflow_gate.review_status
      equals: approved
    on_changes_requested:
      action: retry_implementation
      maximum_cycles: 2
      exhausted: needs_input
    on_blocked: needs_input
    delivery:
      branch: local
      commit_required: true
      push: forbidden
      pull_request: forbidden
      merge: forbidden
      deploy: forbidden
